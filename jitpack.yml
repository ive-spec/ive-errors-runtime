jdk:
  - openjdk21
before_install:
  - sdk install maven 3.9.9
  - B="$HOME/.sdkman/candidates/maven/current/boot"; which java; java -version; echo "CDPATH=$CDPATH CLASSPATH=$CLASSPATH JAVA_HOME=$JAVA_HOME"
  - java -cp "$B/plexus-classworlds-2.8.0.jar" org.codehaus.plexus.classworlds.launcher.Launcher; echo "direct launcher exit=$?"
  - unzip -l "$B/plexus-classworlds-2.8.0.jar" | grep launcher/Launcher || true
  - sh -x "$HOME/.sdkman/candidates/maven/current/bin/mvn" -v 2>&1 | tail -40
install:
  - mvn clean install -DskipTests
